     ========================= -->
    <script>
        const ezaugarriak = [
            "Sendotasuna", "Trebezia", "Bizkortasuna", 
            "Hautematea", "Boterea", "Adimena", "Karisma"
        ];

        const ezaugarriLaburdurak = {
            "SEN": 0, "TRE": 1, "BIZ": 2, 
            "HAU": 3, "BOT": 4, "ADI": 5, "KAR": 6
        };

        const oinarrizkoGaitasunakZerrenda = [
            { izena: "ARRETA", ezaugarria: "HAU" },
            { izena: "ARTISAUTZA", ezaugarria: "TRE" },
            { izena: "ATLETISMOA", ezaugarria: "BIZ" },
            { izena: "BI ESKUKO ARMAK", ezaugarria: "TRE" },
            { izena: "BIZIRAUPENA", ezaugarria: "HAU" },
            { izena: "BORONDATEA", ezaugarria: "BOT" },
            { izena: "DISTANTZIAKO ARMAK", ezaugarria: "HAU" },
            { izena: "ERAGINA", ezaugarria: "KAR" },
            { izena: "ERRESISTENTZIA", ezaugarria: "SEN" },
            { izena: "ESKU BATEKO ARMAK", ezaugarria: "TRE" },
            { izena: "ESKU JOKOA", ezaugarria: "BIZ" },
            { izena: "IRUZUR EGIN", ezaugarria: "KAR" },
            { izena: "ISILTASUNA", ezaugarria: "BIZ" },
            { izena: "JAURTIGAIAK", ezaugarria: "TRE" },
            { izena: "KALE EZAGUTZA", ezaugarria: "KAR" },
            { izena: "MERKATARITZA", ezaugarria: "KAR" },
            { izena: "SAIHESTU", ezaugarria: "BIZ" },
            { izena: "ZALDIAK", ezaugarria: "TRE" },
            { izena: "ZORROZTASUNA", ezaugarria: "ADI" }
        ];

        // Jatorrien datu-basea
        const jatorriakDatuak = [
            {
                id: "DiasporaEleshita",
                izena: "Diaspora Eleshita",
                estatusa: "Oparoa",
                onartutakoLeinuak: ["Ertaina"],
                deskribapena: "Uda Hirietan eleshiten merkataritza etxe handiek negozio guztiak bereganatu dituzte. Honen aurrean, familia aberatsen bigarren seme-alaba askok, hiri-estatuak utzi eta Vasantara bidaiatzen dute negozio aukera berrien bila.\n\nErresuma Ertainetako hiri gehienetan, banku, diru-mailegu eta merkataritzan diharduten komunitate eleshita oparo bat aurkitu daiteke. Bere baliabideak direla eta, noblezia eta bertako burgesekin lotura sendoak dituzte eta eragin politiko handiko etorkinak dira.",
                dohainak: [
                    { izena: "Malkarrak zelaitzen", desk: "Kostua: Istorioan behin\nDiruak malkarrak zelaitzen omen ditu. Zuk aukeratutako eta etsaia ez den PEJ oparoa edo boteretsu baten jarrera +30 aldatzen da." },
                    { izena: "Uda Hirietako Sendia", desk: "Kostua: Istorian behin\nIstorian behin Uda Hirietako merkatal famili handiekin lotura duen PEJ bat probarik egin gabe sortu ahalko duzu." }
                ],
                gaitasunak: [
                    { gIndizea: 7, maila: 4 },   // ERAGINA
                    { gIndizea: 15, maila: 2 },  // MERKATARITZA
                    { gIndizea: 0, maila: 1 },   // ARRETA
                    { gIndizea: 1, maila: 1 },   // ARTISAUTZA
                    { gIndizea: 10, maila: 1 },  // ESKU JOKOA
                    { gIndizea: 17, maila: 1 }   // ZALDIAK
                ],
                bestelakoGaitasunak: [
                    { izena: "Ohiturak (Eleshita)", ezaugarria: "ADI", maila: 4 },
                    { izena: "Ohiturak (Erresuma Ertainak)", ezaugarria: "ADI", maila: 2 },
                    { izena: "Jakituria (Legeak)", ezaugarria: "ADI", maila: 1 }
                ]
            }
        ];

        let balioak = [];
        let jatorrizkoBalioak = []; 
        let unekoPasua = 1;
        let hautatutakoLeinua = "";
        let hautatutakoJatorriaObj = null;
        let aukeratutakoJatorriDohaina = null;
        let lortutakoGaitasunMailak = {};

        function dadoaJaurti() {
            return Math.floor(Math.random() * 6) + 1;
        }

        function pasuaAldatu(pasuBerria) {
            unekoPasua = pasuBerria;
            document.querySelectorAll('.pausoa').forEach(p => p.classList.remove('aktiboa'));
            document.getElementById(`pauso${unekoPasua}`).classList.add('aktiboa');

            for (let i = 1; i <= 4; i++) {
                const ind = document.getElementById(`indPauso${i}`);
                if(ind) {
                    ind.className = "";
                    if (i < unekoPasua) ind.classList.add('egina');
                    else if (i === unekoPasua) ind.classList.add('unekoa');
                }
            }
        }

        /* 1. PAUSOA: EZAUGARRIAK */
        document.getElementById("sortu").addEventListener("click", () => {
            const taula = document.getElementById("Emaitzataula");
            taula.innerHTML = "";
            balioak = [];
            jatorrizkoBalioak = [];

            for (let i = 0; i < ezaugarriak.length; i++) {
                const dado1 = dadoaJaurti();
                const dado2 = dadoaJaurti();
                const dado3 = dadoaJaurti();
                const guztira = dado1 + dado2 + dado3;

                balioak.push(guztira);
                jatorrizkoBalioak.push(guztira);

                taula.innerHTML += `
                    <tr>
                        <td>${ezaugarriak[i]}</td>
                        <td>${dado1}</td>
                        <td>${dado2}</td>
                        <td>${dado3}</td>
                        <td><strong>${guztira}</strong></td>
                    </tr>
                `;
            }

            pertsonaiaEguneratu();
            document.getElementById("hurrengoa1").style.display = "inline-block";
        });

        document.getElementById("hurrengoa1").addEventListener("click", () => {
            pasuaAldatu(2);
        });


        /* 2. PAUSOA: LEINUA */
        const leinuSelect = document.getElementById("leinuSelect");

        leinuSelect.addEventListener("change", () => {
            hautatutakoLeinua = leinuSelect.value;
            document.getElementById("fichaLeinua").textContent = hautatutakoLeinua || "—";

            balioak = [...jatorrizkoBalioak];

            leinuBadgesEguneratu();
            leinuDeskribapenaEguneratu();
            leinuOndorioakAplikatu();
            gizakiAukeraEguneratu();
            dohaiaEguneratu();
            
            hautatutakoJatorriaObj = null;
            aukeratutakoJatorriDohaina = null;
            lortutakoGaitasunMailak = {};
            document.getElementById("jatorriSelect").value = "";
            document.getElementById("jatorriDeskribapena").style.display = "none";
            document.getElementById("jatorriDohainAukera").style.display = "none";
            document.getElementById("fichaEstatusa").textContent = "—";
            document.getElementById("dohainIzenaJatorria").textContent = "—";
            document.getElementById("dohainDeskribapenaJatorria").textContent = "Aukeratu jatorri bat dohaia hemen agertzeko.";

            jatorriakKargatu();
            pertsonaiaEguneratu();

            const hurrengoa2 = document.getElementById("hurrengoa2");
            if (hautatutakoLeinua === "") {
                hurrengoa2.style.display = "none";
            } else if (hautatutakoLeinua === "Gizakia") {
                hurrengoa2.style.display = document.getElementById("gizakiEzaugarria").value !== "" ? "inline-block" : "none";
            } else {
                hurrengoa2.style.display = "inline-block";
            }
        });

        function leinuBadgesEguneratu() {
            const badgeContainer = document.getElementById("leinuBadges");
            badgeContainer.innerHTML = '';

            const modifikatzaileak = {
                Elfoa: { SEN: -2, BIZ: 1, HAU: 2 },
                Ertaina: { SEN: -2, KAR: 3 },
                Ipotxa: { SEN: 2, BIZ: -2, KAR: -2, BOT: 2 },
                Jentila: { SEN: 4, ADI: -3, KAR: -2, BOT: 1 }
            };

            if (hautatutakoLeinua && modifikatzaileak[hautatutakoLeinua]) {
                for (const [ezaugarria, balioa] of Object.entries(modifikatzaileak[hautatutakoLeinua])) {
                    const badge = document.createElement('span');
                    const ikurra = balioa > 0 ? `+${balioa}` : `${balioa}`;
                    badge.className = `badge ${balioa > 0 ? 'pos' : 'neg'}`;
                    badge.textContent = `${ezaugarria} ${ikurra}`;
                    badgeContainer.appendChild(badge);
                }
            }
        }

        function leinuDeskribapenaEguneratu() {
            const deskKutxa = document.getElementById("leinuDeskribapena");
            const deskribapenak = {
                Elfoa: "Atari dimentsional batetik etorriak, elfoak beste iratxo askorekin batera gaizki irten zen erritual batengatik iritsi ziren mundura. Jaioterritik bananduta, elfoak, etenik ez duen heriotza eta berraragiztatze ziklo batean harrapaturik aurkitzen dira.",
                Gizakia: "Munduko leinurik hedatuena da gizakiena. Thandako mendi izoztuetatik Havako desertuetaraino aurkitu daitezke. Antzinakoekin batera izarren artean bidaiatu eta zeruko ateak irekitzerakoan heldu ziren Aendorrera. Gizakiak adoretsuak eta edozein egoeretara moldatzeko iaioak dira.",
                Jentila: "Aendorreko jatorrizko leinuetako bat dira jentilak. Gizakiak baino garaiago, indartsuago eta azkarragoak izandakoak, antzinakoei laguntzean leinu guztiaren arima sakrifikatu zuten. Gertaera horretatik aurrera, belaunaldiz belaunaldi, degeneratuz joan dira. Hala ere, gaur egun oraindik argitasuna mantentzea lortu dute.",
                Ipotxa: "Materia hiletik, eraikitzaile eta zaindari bezala sortuak, ipotxak antzinakoen nekropoliak babesteko egin ziren.",
                Ertaina: "Inork ez daki ziur nola eta noiz iritsi ziren ertainek hona. Nahiz eta gizakien antzekoak izan, azaldu ezin den sentsazio bat igartzen da beraien ondoan egotean. Zerbait ondo ez dagoenaren sentsazioa. Ertainak mundu osoan zehar zabaldu dira eta zorte izugarri handiko izakien ospea irabazi dute."
            };

            if (deskribapenak[hautatutakoLeinua]) {
                deskKutxa.style.display = "block";
                deskKutxa.textContent = deskribapenak[hautatutakoLeinua];
            } else {
                deskKutxa.style.display = "none";
                deskKutxa.textContent = "";
            }
        }

        function leinuOndorioakAplikatu() {
            if (hautatutakoLeinua === "Elfoa") {
                balioak[0] -= 2; balioak[2] += 1; balioak[3] += 2;
            } else if (hautatutakoLeinua === "Ertaina") {
                balioak[0] -= 2; balioak[6] += 3;
            } else if (hautatutakoLeinua === "Ipotxa") {
                balioak[0] += 2; balioak[2] -= 2; balioak[6] -= 2; balioak[4] += 2;
            } else if (hautatutakoLeinua === "Jentila") {
                balioak[0] += 4; balioak[5] -= 3; balioak[6] -= 2; balioak[4] += 1;
            }
        }

        function gizakiAukeraEguneratu() {
            const gizakiAukera = document.getElementById("gizakiAukera");
            const gizakiEzaugarria = document.getElementById("gizakiEzaugarria");

            if (hautatutakoLeinua !== "Gizakia") {
                gizakiAukera.style.display = "none";
                return;
            }

            gizakiAukera.style.display = "block";
            gizakiEzaugarria.innerHTML = `<option value="">Aukeratu ezaugarria</option>`;

            for (let i = 0; i < balioak.length; i++) {
                if (jatorrizkoBalioak[i] < 11) {
                    gizakiEzaugarria.innerHTML += `<option value="${i}">${ezaugarriak[i]} (${jatorrizkoBalioak[i]})</option>`;
                }
            }
        }

        document.getElementById("gizakiEzaugarria").addEventListener("change", (e) => {
            const hautapena = e.target.value;
            balioak = [...jatorrizkoBalioak];
            leinuOndorioakAplikatu();

            if (hautapena !== "") {
                const indizea = parseInt(hautapena);
                balioak[indizea] = 11;
                document.getElementById("hurrengoa2").style.display = "inline-block";
            } else {
                document.getElementById("hurrengoa2").style.display = "none";
            }
            pertsonaiaEguneratu();
        });

        document.getElementById("hurrengoa2").addEventListener("click", () => {
            pasuaAldatu(3);
        });

        document.getElementById("atzera2").addEventListener("click", () => {
            pasuaAldatu(1);
        });


        /* 3. PAUSOA: JATORRIA */
        function jatorriakKargatu() {
            const jatorriSelect = document.getElementById("jatorriSelect");
            jatorriSelect.innerHTML = `<option value="">Aukeratu jatorria</option>`;

            if (!hautatutakoLeinua) return;

            jatorriakDatuak.forEach(j => {
                if (j.onartutakoLeinuak.includes(hautatutakoLeinua)) {
                    jatorriSelect.innerHTML += `<option value="${j.id}">${j.izena} (${j.estatusa})</option>`;
                }
            });
        }

        const jatorriSelect = document.getElementById("jatorriSelect");
        jatorriSelect.addEventListener("change", (e) => {
            const jId = e.target.value;
            hautatutakoJatorriaObj = jatorriakDatuak.find(j => j.id === jId);

            const deskKutxa = document.getElementById("jatorriDeskribapena");
            const dohainKutxa = document.getElementById("jatorriDohainAukera");
            const hurrengoa3 = document.getElementById("hurrengoa3");

            aukeratutakoJatorriDohaina = null;
            document.querySelectorAll('input[name="jatorriDohaina"]').forEach(el => el.checked = false);

            if (hautatutakoJatorriaObj) {
                document.getElementById("fichaEstatusa").textContent = hautatutakoJatorriaObj.estatusa;
                deskKutxa.style.display = "block";
                deskKutxa.textContent = hautatutakoJatorriaObj.deskribapena;

                document.getElementById("jGenDohain1Izena").textContent = hautatutakoJatorriaObj.dohainak[0].izena;
                document.getElementById("jGenDohain1Desk").textContent = hautatutakoJatorriaObj.dohainak[0].desk;
                document.getElementById("jGenDohain2Izena").textContent = hautatutakoJatorriaObj.dohainak[1].izena;
                document.getElementById("jGenDohain2Desk").textContent = hautatutakoJatorriaObj.dohainak[1].desk;
                dohainKutxa.style.display = "block";

                lortutakoGaitasunMailak = {};
                hautatutakoJatorriaObj.gaitasunak.forEach(g => {
                    lortutakoGaitasunMailak[g.gIndizea] = g.maila;
                });

                hurrengoa3.style.display = "none";
            } else {
                document.getElementById("fichaEstatusa").textContent = "—";
                deskKutxa.style.display = "none";
                dohainKutxa.style.display = "none";
                lortutakoGaitasunMailak = {};
                hurrengoa3.style.display = "none";
                document.getElementById("dohainIzenaJatorria").textContent = "—";
                document.getElementById("dohainDeskribapenaJatorria").textContent = "Aukeratu jatorri bat dohaia hemen agertzeko.";
            }

            pertsonaiaEguneratu();
        });

        document.querySelectorAll('input[name="jatorriDohaina"]').forEach(input => {
            input.addEventListener("change", (e) => {
                const index = parseInt(e.target.value);
                if (hautatutakoJatorriaObj) {
                    aukeratutakoJatorriDohaina = hautatutakoJatorriaObj.dohainak[index];
                    document.getElementById("dohainIzenaJatorria").textContent = aukeratutakoJatorriDohaina.izena;
                    document.getElementById("dohainDeskribapenaJatorria").textContent = aukeratutakoJatorriDohaina.desk;
                    document.getElementById("hurrengoa3").style.display = "inline-block";
                }
            });
        });

        document.getElementById("hurrengoa3").addEventListener("click", () => {
            pasuaAldatu(4);
        });

        document.getElementById("atzera3").addEventListener("click", () => {
            pasuaAldatu(2);
        });

        document.getElementById("atzera4").addEventListener("click", () => {
            pasuaAldatu(3);
        });

        function dohaiaEguneratu() {
            const dohainIzenaLeinua = document.getElementById("dohainIzenaLeinua");
            const dohainDeskribapenaLeinua = document.getElementById("dohainDeskribapenaLeinua");
            
            const leinuDohainak = {
                Elfoa: { izena: "Berraragiztatze Zikloa", desk: "Elfoak bere iraganeko bizitzetako oroitzapen tarteka berragertzen zaizkio, egoera kritikoetan abantaila emanez." },
                Gizakia: { izena: "Moldakortasuna", desk: "Gizakiek gaitasun berriak ikasteko erraztasun berezia dute." },
                Ipotxa: { izena: "Harriaren Senitartekoa", desk: "Harri eta mineralekin lan egiterakoan eta haien azpian orientatzeko orduan gaitasun berezia dute." },
                Jentila: { izena: "Arima Zaharra", desk: "Naturarekiko eta antzinako jakinduriekiko lotura sakona mantentzen dute." },
                Ertaina: { izena: "Zorte Ona", desk: "Egoera arriskutsuetan zorte miragarria izateko joera dute." }
            };

            if (hautatutakoLeinua && leinuDohainak[hautatutakoLeinua]) {
                dohainIzenaLeinua.textContent = leinuDohainak[hautatutakoLeinua].izena;
                dohainDeskribapenaLeinua.textContent = leinuDohainak[hautatutakoLeinua].desk;
            } else {
                dohainIzenaLeinua.textContent = "—";
                dohainDeskribapenaLeinua.textContent = "Aukeratu leinu bat dohaia hemen agertzeko.";
            }
        }


        /* PERTSONAIA ORRIA EGUNERATU */
        function pertsonaiaEguneratu() {
            const fichaTaula = document.getElementById("fichaEzaugarriakGorputza");
            fichaTaula.innerHTML = "";

            for (let i = 0; i < ezaugarriak.length; i++) {
                const balioa = balioak[i] !== undefined ? balioak[i] : "—";
                const aldatuta = (balioak[i] !== jatorrizkoBalioak[i]);
                const estiloa = aldatuta ? 'color: #27ae60; font-weight: bold;' : '';

                fichaTaula.innerHTML += `
                    <tr>
                        <td>${ezaugarriak[i]}</td>
                        <td><strong style="${estiloa}">${balioa}</strong></td>
                    </tr>
                `;
            }

            const oinarrizkoTaula = document.getElementById("fichaOinarrizkoGaitasunakGorputza");
            oinarrizkoTaula.innerHTML = "";

            if (balioak.length > 0) {
                oinarrizkoGaitasunakZerrenda.forEach((gaitasuna, index) => {
                    const ezaugarriIndizea = ezaugarriLaburdurak[gaitasuna.ezaugarria] !== undefined ? ezaugarriLaburdurak[gaitasuna.ezaugarria] : 6; 
                    const ezaugarriBalioa = balioak[ezaugarriIndizea] || 0;
                    
                    let balioTotala = ezaugarriBalioa * 2;
                    const mailaKopurua = lortutakoGaitasunMailak[index] || 0;

                    for (let m = 1; m <= mailaKopurua; m++) {
                        if (m === 1) balioTotala += 15;
                        else if (m === 2) balioTotala += 10;
                        else if (m >= 3 && m <= 5) balioTotala += 10;
                        else if (m >= 6 && m <= 7) balioTotala += 5;
                    }

                    let karratuakHTML = `<div class="maila-karratuak">`;
                    for (let m = 1; m <= 7; m++) {
                        const beteta = m <= mailaKopurua ? "beteta" : "";
                        karratuakHTML += `<span class="maila-karratua ${beteta}"></span>`;
                    }
                    karratuakHTML += `</div>`;

                    oinarrizkoTaula.innerHTML += `
                        <tr>
                            <td>${gaitasuna.izena}</td>
                            <td>${gaitasuna.ezaugarria}</td>
                            <td>${karratuakHTML}</td>
                            <td><strong>${balioTotala}</strong></td>
                        </tr>
                    `;
                });
            }

            // Bestelako gaitasunak kargatu jatorritik baldin baditu
            const bestelakoTaula = document.getElementById("fichaBestelakoGaitasunakGorputza");
            bestelakoTaula.innerHTML = "";

            if (hautatutakoJatorriaObj && hautatutakoJatorriaObj.bestelakoGaitasunak) {
                hautatutakoJatorriaObj.bestelakoGaitasunak.forEach((bg) => {
                    let balioTotala = 0;
                    // Hemen kalkulua egokitu dezakezu behar izanez gero
                    let karratuakHTML = `<div class="maila-karratuak">`;
                    for (let m = 1; m <= 7; m++) {
                        const beteta = m <= bg.maila ? "beteta" : "";
                        karratuakHTML += `<span class="maila-karratua ${beteta}"></span>`;
                    }
                    karratuakHTML += `</div>`;

                    bestelakoTaula.innerHTML += `
                        <tr>
                            <td>${bg.izena}</td>
                            <td>${bg.ezaugarria}</td>
                            <td>${karratuakHTML}</td>
                            <td><strong>${bg.maila * 5}</strong></td>
                        </tr>
                    `;
                });
            }
        }
    </script>
