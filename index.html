<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilgora Pertsonaia Sortzailea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .ezaugarriak-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .ezaugarri-item {
            background: #eef2f3;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #emaitza {
            margin-top: 20px;
            background: #e8f8f5;
            padding: 15px;
            border-left: 5px solid #2ecc71;
            border-radius: 4px;
        }
        /* Etiketa edo badge bisualen estiloak */
        .badge-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.pos {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .badge.neg {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ilgora Pertsonaia Sortzailea</h1>
        
        <div class="form-group">
            <label for="izenak">Pertsonaiaren Izena:</label>
            <input type="text" id="izenak" placeholder="Sartu izena...">
        </div>

        <div class="form-group">
            <label for="leinuSelect">Aukeratu Leinua:</label>
            <select id="leinuSelect">
                <option value="">-- Hautatu leinua --</option>
                <option value="jentila">Jentila</option>
                <option value="ipotxa">Ipotxa</option>
                <option value="ertaina">Ertaina</option>
            </select>
            <!-- Hemen agertuko dira leinuaren aldaketak modu bisualean -->
            <div id="leinuBadges" class="badge-container"></div>
        </div>

        <h2>Oinarrizko Ezaugarriak</h2>
        <div class="ezaugarriak-grid">
            <div class="ezaugarri-item">
                <span>SEN (Senide/Sentikortasuna):</span>
                <span id="val-SEN">10</span>
            </div>
            <div class="ezaugarri-item">
                <span>ADI (Adimena):</span>
                <span id="val-ADI">10</span>
            </div>
            <div class="ezaugarri-item">
                <span>KAR (Karisma):</span>
                <span id="val-KAR">10</span>
            </div>
            <div class="ezaugarri-item">
                <span>BOT (Boterea):</span>
                <span id="val-BOT">10</span>
            </div>
            <div class="ezaugarri-item">
                <span>BIZ (Bizitasuna):</span>
                <span id="val-BIZ">10</span>
            </div>
        </div>

        <button id="sortuBtn">Pertsonaia Eguneratu / Sortu</button>

        <div id="emaitza" style="display:none;">
            <h3>Pertsonaiaren Xehetasunak</h3>
            <p><strong>Izena:</strong> <span id="res-izena"></span></p>
            <p><strong>Leinua:</strong> <span id="res-leinua"></span></p>
            <p><strong>Ezaugarri Finalak:</strong></p>
            <ul id="res-ezaugarriak"></ul>
        </div>
    </div>

    <script>
        // Leinuen ezaugarri-modifikazioak
        const leinuak = {
            jentila: {
                SEN: 4,
                ADI: -3,
                KAR: -2,
                BOT: 1
            },
            ipotxa: {
                SEN: 2,
                BIZ: -2,
                KAR: -2,
                BOT: 2
            },
            ertaina: {
                SEN: -2,
                KAR: 3
            }
        };

        const oinarrizkoEzaugarriak = {
            SEN: 10,
            ADI: 10,
            KAR: 10,
            BOT: 10,
            BIZ: 10
        };

        // Leinua aldatzen den bakoitzean etiketak modu bisualean eguneratzeko funtzioa
        document.getElementById('leinuSelect').addEventListener('change', function() {
            const leinuIzena = this.value;
            const badgeContainer = document.getElementById('leinuBadges');
            badgeContainer.innerHTML = '';

            if (leinuIzena && leinuak[leinuIzena]) {
                const modifikatzaileak = leinuak[leinuIzena];
                for (const [ezaugarria, balioa] of Object.entries(modifikatzaileak)) {
                    const badge = document.createElement('span');
                    const ikurra = balioa > 0 ? `+${balioa}` : `${balioa}`;
                    badge.className = `badge ${balioa > 0 ? 'pos' : 'neg'}`;
                    badge.textContent = `${ezaugarria} ${ikurra}`;
                    badgeContainer.appendChild(badge);
                }
            }
        });

        document.getElementById('sortuBtn').addEventListener('click', function() {
            const izena = document.getElementById('izenak').value || "Izengabea";
            const leinuIzena = document.getElementById('leinuSelect').value;

            // Kopiatu oinarrizko balioak objektu berri batera
            let pertsonaiaEzaugarriak = { ...oinarrizkoEzaugarriak };

            // Leinua hautatuta badago, modifikatzaileak aplikatu
            if (leinuIzena && leinuak[leinuIzena]) {
                const modifikatzaileak = leinuak[leinuIzena];
                for (const [ezaugarria, balioa] of Object.entries(modifikatzaileak)) {
                    if (pertsonaiaEzaugarriak[ezaugarria] !== undefined) {
                        pertsonaiaEzaugarriak[ezaugarria] += balioa;
                    } else {
                        pertsonaiaEzaugarriak[ezaugarria] = balioa;
                    }
                }
            }

            // Erakutsi pantailan ezaugarri eguneratuak
            for (const [ezaugarria, balioa] of Object.entries(pertsonaiaEzaugarriak)) {
                const elementua = document.getElementById(`val-${ezaugarria}`);
                if (elementua) {
                    elementua.textContent = balioa;
                }
            }

            // Emaitzen koadroa bete eta erakutsi
            document.getElementById('res-izena').textContent = izena;
            document.getElementById('res-leinua').textContent = leinuIzena ? leinuIzena.toUpperCase() : "Hautatu gabe";
            
            const lista = document.getElementById('res-ezaugarriak');
            lista.innerHTML = '';
            for (const [ezaugarria, balioa] of Object.entries(pertsonaiaEzaugarriak)) {
                const li = document.createElement('li');
                li.textContent = `${ezaugarria}: ${balioa}`;
                lista.appendChild(li);
            }

            document.getElementById('emaitza').style.display = 'block';
        });
    </script>
</body>
</html>
</body>

</html>
