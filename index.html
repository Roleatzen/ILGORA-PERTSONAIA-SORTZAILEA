<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ILGORA - Pertsonaia Sortzailea</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 4px;
        }

        header h2 {
            margin: 5px 0 0 0;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 2px;
        }


        /* =========================
           SORTZAILEA
        ========================= */

        #sortzailea {
            max-width: 900px;
            margin: 0 auto 50px auto;
            text-align: center;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background-color: #222;
            color: white;
        }


        /* =========================
           LEINUA AUKERATU
        ========================= */

        #leinuAukeraketa {
            background-color: white;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 25px;
        }

        #leinuAukeraketa h3 {
            margin-top: 0;
        }

        select {
            padding: 8px;
            font-size: 16px;
            min-width: 200px;
        }

        #gizakiAukera {
            margin-top: 20px;
            display: none;
        }


        /* =========================
           PERTSONAIA ORRIA
        ========================= */

        #pertsonaiaOrria {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border: 2px solid #222;
            padding: 30px;
            box-sizing: border-box;
        }

        #pertsonaiaOrria h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 2px;
        }


        .ficha-goiburua {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .kutxa {
            border: 1px solid #333;
            padding: 15px;
            min-height: 50px;
        }

        .kutxa-izenburua {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .kutxa-balioa {
            font-size: 20px;
        }


        /* =========================
           DOHAINAK
        ========================= */

        #dohainak {
            margin-top: 30px;
        }

        #dohainak h3 {
            border-bottom: 2px solid #222;
            padding-bottom: 8px;
        }

        .dohain-kutxa {
            border: 1px solid #333;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .dohain-izena {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .dohain-deskribapena {
            line-height: 1.5;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            header h1 {
                font-size: 32px;
            }

            header h2 {
                font-size: 16px;
            }

            #pertsonaiaOrria {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         GOIBURUA
    ========================== -->

    <header>

        <h1>ILGORA</h1>

        <h2>PERTSONAIA SORTZAILEA</h2>

    </header>



    <!-- =========================
         SORTZAILEA
    ========================== -->

    <section id="sortzailea">

        <h2>Ezaugarriak (3d6)</h2>


        <button id="sortu">
            Sortu
        </button>


        <!-- LEINUA -->

        <div id="leinuAukeraketa">

            <h3>Leinua</h3>

            <select id="leinuSelect">

                <option value="">
                    Aukeratu leinua
                </option>

                <option value="Gizakia">
                    Gizakia
                </option>

                <option value="Elfoa">
                    Elfoa
                </option>

                <option value="Ertaina">
                    Ertaina
                </option>

                <option value="Ipotxa">
                    Ipotxa
                </option>

                <option value="Jentila">
                    Jentila
                </option>

            </select>


            <!-- Gizakiaren aukera berezia -->

            <div id="gizakiAukera">

                <label for="gizakiEzaugarria">
                    Aukeratu 11 baino txikiagoa den ezaugarria:
                </label>

                <br><br>

                <select id="gizakiEzaugarria">

                    <option value="">
                        Aukeratu ezaugarria
                    </option>

                </select>

            </div>

        </div>



        <!-- EZaugarriak -->

        <table>

            <thead>

                <tr>
                    <th>Ezaugarria</th>
                    <th>1. Dadoa</th>
                    <th>2. Dadoa</th>
                    <th>3. Dadoa</th>
                    <th>Denera</th>
                </tr>

            </thead>


            <tbody id="Emaitzataula">

            </tbody>

        </table>

    </section>



    <!-- =========================
         PERTSONAIA ORRIA
    ========================== -->

    <section id="pertsonaiaOrria">

        <h2>ILGORA - PERTSONAIA</h2>


        <!-- LEINUA -->

        <div class="ficha-goiburua">

            <div class="kutxa">

                <div class="kutxa-izenburua">
                    LEINUA
                </div>

                <div
                    class="kutxa-balioa"
                    id="fichaLeinua">
                    —
                </div>

            </div>

        </div>



        <!-- EZAUGARRIAK -->

        <table>

            <thead>

                <tr>
                    <th>Ezaugarria</th>
                    <th>Balioa</th>
                </tr>

            </thead>


            <tbody id="fichaEzaugarriakGorputza">

            </tbody>

        </table>



        <!-- DOHAINAK -->

        <div id="dohainak">

            <h3>DOHAINAK</h3>

            <div class="dohain-kutxa">

                <div
                    class="dohain-izena"
                    id="dohainIzena">
                    —
                </div>

                <div
                    class="dohain-deskribapena"
                    id="dohainDeskribapena">
                    Aukeratu leinu bat dohaia hemen agertzeko.
                </div>

            </div>

        </div>


    </section>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =========================
           EZAUGARRIAK
        ========================== */

        const ezaugarriak = [

            "Sendotasuna",
            "Trebezia",
            "Bizkortasuna",
            "Hautematea",
            "Boterea",
            "Adimena",
            "Karisma"

        ];


        /*
         * Uneko pertsonaiaren balioak
         */

        let balioak = [];



        /* =========================
           DADOA
        ========================== */

        function dadoaJaurti() {

            return Math.floor(Math.random() * 6) + 1;

        }



        /* =========================
           TIRADAK
        ========================== */

        function tiradakSortu() {

            const taula =
                document.getElementById("Emaitzataula");

            const fichaTaula =
                document.getElementById(
                    "fichaEzaugarriakGorputza"
                );


            taula.innerHTML = "";
            fichaTaula.innerHTML = "";


            balioak = [];


            for (
                let i = 0;
                i < ezaugarriak.length;
                i++
            ) {

                const dado1 = dadoaJaurti();
                const dado2 = dadoaJaurti();
                const dado3 = dadoaJaurti();

                const guztira =
                    dado1 + dado2 + dado3;


                balioak.push(guztira);


                taula.innerHTML += `

                    <tr>

                        <td>
                            ${ezaugarriak[i]}
                        </td>

                        <td>
                            ${dado1}
                        </td>

                        <td>
                            ${dado2}
                        </td>

                        <td>
                            ${dado3}
                        </td>

                        <td>
                            <strong>
                                ${guztira}
                            </strong>
                        </td>

                    </tr>

                `;

            }


            pertsonaiaEguneratu();

            gizakiAukeraEguneratu();

        }



        /* =========================
           PERTSONAIA ORRIA
        ========================== */

        function pertsonaiaEguneratu() {

            const fichaTaula =
                document.getElementById(
                    "fichaEzaugarriakGorputza"
                );


            fichaTaula.innerHTML = "";


            for (
                let i = 0;
                i < ezaugarriak.length;
                i++
            ) {

                fichaTaula.innerHTML += `

                    <tr>

                        <td>
                            ${ezaugarriak[i]}
                        </td>

                        <td>
                            <strong>
                                ${balioak[i]}
                            </strong>
                        </td>

                    </tr>

                `;

            }

        }



        /* =========================
           LEINUA
        ========================== */

        const leinuSelect =
            document.getElementById("leinuSelect");


        leinuSelect.addEventListener(
            "change",
            leinuaAldatu
        );


        function leinuaAldatu() {

            const leinua =
                leinuSelect.value;


            document.getElementById(
                "fichaLeinua"
            ).textContent =
                leinua || "—";


            /*
             * Gizakia aukeratzen bada,
             * bere aukera erakutsi.
             */

            gizakiAukeraEguneratu();


            /*
             * Dohaina
             */

            dohaiaEguneratu();

        }



        /* =========================
           GIZAKIA
        ========================== */

        function gizakiAukeraEguneratu() {

            const gizakiAukera =
                document.getElementById(
                    "gizakiAukera"
                );


            const gizakiEzaugarria =
                document.getElementById(
                    "gizakiEzaugarria"
                );


            /*
             * Ez badago tiradarik,
             * ez dugu aukerarik erakusten.
             */

            if (
                leinuSelect.value !== "Gizakia" ||
                balioak.length === 0
            ) {

                gizakiAukera.style.display = "none";

                return;

            }


            gizakiAukera.style.display = "block";


            /*
             * Aukerak garbitu
             */

            gizakiEzaugarria.innerHTML = `

                <option value="">
                    Aukeratu ezaugarria
                </option>

            `;


            /*
             * 11 baino txikiagoak direnak
             */

            for (
                let i = 0;
                i < balioak.length;
                i++
            ) {

                if (balioak[i] < 11) {

                    gizakiEzaugarria.innerHTML += `

                        <option value="${i}">
                            ${ezaugarriak[i]}
                            (${balioak[i]})
                        </option>

                    `;

                }

            }

        }



        /*
         * Gizakiak ezaugarria aukeratzen du
         */

        document
            .getElementById("gizakiEzaugarria")
            .addEventListener(
                "change",
                gizakiarenAukera
            );


        function gizakiarenAukera() {

            const hautapena =
                document.getElementById(
                    "gizakiEzaugarria"
                ).value;


            if (hautapena === "") {
                return;
            }


            const indizea =
                parseInt(hautapena);


            /*
             * 11ra igo
             */

            balioak[indizea] = 11;


            /*
             * Ficha eguneratu
             */

            pertsonaiaEguneratu();

        }



        /* =========================
           DOHAINAK
        ========================== */

        function dohaiaEguneratu() {

            const leinua =
                leinuSelect.value;


            const izena =
                document.getElementById(
                    "dohainIzena"
                );

            const deskribapena =
                document.getElementById(
                    "dohainDeskribapena"
                );


            /*
             * Oraingoz Gizakiarena bakarrik
             */

            if (leinua === "Gizakia") {

                izena.textContent =
                    "Dohaina";

                deskribapena.textContent =
                    "Gizakiaren dohainaren mekanika hemen azalduko da.";

            }

            else if (leinua === "") {

                izena.textContent = "—";

                deskribapena.textContent =
                    "Aukeratu leinu bat dohaia hemen agertzeko.";

            }

            else {

                izena.textContent =
                    "Dohaina";

                deskribapena.textContent =
                    "Leinu honen dohainaren mekanika zehazteke dago.";

            }

        }



        /* =========================
           SORTU BOTOIA
        ========================== */

        document
            .getElementById("sortu")
            .addEventListener(
                "click",
                tiradakSortu
            );

    </script>

</body>

</html>
