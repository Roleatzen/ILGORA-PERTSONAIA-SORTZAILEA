<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <title>Ilgora Pertsonaia Sortzailea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .sortzailea-atalap {
            background: #eef2f7;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            border-left: 5px solid #3498db;
        }
        .ficha-atalap {
            background: #fff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ddd;
            border-left: 5px solid #2ecc71;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
        select, input {
            padding: 6px;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .deskribapena {
            font-style: italic;
            color: #555;
            margin-top: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- GOIKO SORTZAILEA -->
    <div class="sortzailea-atalap">
        <h1>ILGORA</h1>
        <h3>PERTSONAIA SORTZAILEA</h3>
        <div id="pausoakEremua">
            <!-- Hemen sortzailearen urratsak kudeatuko dira -->
        </div>
    </div>

    <hr>

    <!-- BEHEKO PERTSONAIA-ORRIA -->
    <div class="ficha-atalap">
        <h2>ILGORA — PERTSONAIA-ORRIA</h2>
        
        <div>
            <strong>LEINUA:</strong> <span id="fichaLeinua">Hautatu gabe</span>
            <div id="fichaLeinuaDesk" class="deskribapena"></div>
        </div>

        <div>
            <strong>JATORRIA:</strong> <span id="fichaJatorria">Hautatu gabe</span>
            <div id="fichaJatorriaDesk" class="deskribapena"></div>
        </div>

        <h3>EZAUGARRIAK</h3>
        <table>
            <thead>
                <tr>
                    <th>Ezaugarria</th>
                    <th>Jatorrizkoa</th>
                    <th>Unekoa</th>
                </tr>
            </thead>
            <tbody id="fichaEzaugarriakTxa">
                <!-- Javascript-ek beteko du -->
            </tbody>
        </table>

        <h3>GAITASUNAK</h3>
        <table>
            <thead>
                <tr>
                    <th>Gaitasuna</th>
                    <th>Balioa / Maila</th>
                </tr>
            </thead>
            <tbody id="fichaGaitasunakTxa">
                <!-- Javascript-ek beteko du -->
            </tbody>
        </table>

        <h3>DOHAINAK</h3>
        <div id="fichaDohainak">
            <p>Oraingoz ez dago dohainik hautatuta.</p>
        </div>
    </div>

    <script>
        const ezaugarriak = ["Sendotasuna", "Trebezia", "Bizkortasuna", "Hautematea", "Boterea", "Adimena", "Karisma"];
        let jatorrizkoBalioak = [10, 10, 10, 10, 10, 10, 10];
        let balioak = [10, 10, 10, 10, 10, 10, 10];
        
        let hautatutakoLeinua = "";
        let hautatutakoJatorria = "";
        let hautatutakoGizakiEzaugarria = "";
        let hautatutakoJatorriDohaina = "";
        let unekoPasua = 1;

        const leinuDeskribapenak = {
            "Gizakia": "Munduko leinurik hedatuena da gizakiena. Thandako mendi izoztuetatik Havako desertuetaraino aurkitu daitezke. Antzinakoekin batera izarren artean bidaiatu eta zeruko ateak irekitzerakoan heldu ziren Aendorrera. Gizakiak adoretsuak eta edozein egoeretara moldatzeko iaioak dira.",
            "Elfoa": "Atari dimentsional batetik etorriak, elfoak beste iratxo askorekin batera gaizki irten zen erritual batengatik iritsi ziren mundura. Jaioterritik bananduta, elfoak, etenik ez duen heriotza eta berraragiztatze ziklo batean harrapaturik aurkitzen dira.",
            "Ipotxa": "Materia hiletik, eraikitzaile eta zaindari bezala sortuak, ipotxak antzinakoen nekropoliak babesteko egin ziren. Denborarekin helburua ahaztu dute baina haien izaera, sortzaileek ezarritako baldintzen menpe jarraitzen du eta lagun leialenak zein etsai mendekarienak izan ohi dira.",
            "Ertaina": "Inork ez daki ziur nola eta noiz iritsi ziren ertainek hona. Nahiz eta gizakien antzekoak izan, azaldu ezin den sentsazio bat igartzen da beraien ondoan egotean. Zerbait ondo ez dagoenaren sentsazioa. Ertainak mundu osoan zehar zabaldu dira eta zorte izugarri handiko izakien ospea irabazi dute.",
            "Jentila": "Aendorreko jatorrizko leinuetako bat dira jentilak. Gizakiak baino garaiago, indartsuago eta azkarragoak izandakoak, antzinakoei laguntzean leinu guztiaren arima sakrifikatu zuten. Gertaera horretatik aurrera, belaunaldiz belaunaldi, degeneratuz joan dira. Hala ere, gaur egun oraindik argitasuna mantentzea lortu dute."
        };

        const jatorriDeskribapenak = {
            "Diaspora Eleshita": "Uda Hirietan eleshiten merkataritza etxe handiek negozio guztiak bereganatu tulite. Honen aurrean, familia aberatsen bigarren seme-alaba askok, hiri-estatuak utzi eta Vasantara bidaiatzen dute negozio aukera berrien bila. Erresuma Ertainetako hiri gehienetan, banku, diru-mailegu eta merkataritzan diharduten komunitate eleshita oparo bat aurkitu daiteke. Bere baliabideak direla eta, noblezia eta bertako burgesekin lotura sendoak dituzte eta eragin politiko handiko etorkinak dira."
        };

        function 3d6Botatzea() {
            return Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1;
        }

        function sortuEzaugarriak() {
            for (let i = 0; i < 7; i++) {
                let val = 3d6Botatzea();
                jatorrizkoBalioak[i] = val;
                balioak[i] = val;
            }
            unekoPasua = 2;
            interfazaMarraztu();
            pertsonaiaEguneratu();
        }

        function leinuaAukeratu(leinua) {
            hautatutakoLeinua = leinua;
            balioak = [...jatorrizkoBalioak]; // Berrezarri lehenago

            // Leinuen aldaketak aplikatu
            if (leinua === "Elfoa") {
                balioak[0] -= 2; // SEN
                balioak[2] += 1; // BIZ
                balioak[3] += 2; // HAU
            } else if (leinua === "Ipotxa") {
                balioak[0] += 2; // SEN
                balioak[2] -= 2; // BIZ
                balioak[6] -= 2; // KAR
                balioak[4] += 2; // BOT
            } else if (leinua === "Ertaina") {
                balioak[0] -= 2; // SEN
                balioak[6] += 3; // KAR
            }

            hautatutakoGizakiEzaugarria = "";
            unekoPasua = 3;
            interfazaMarraztu();
            pertsonaiaEguneratu();
        }

        function gizakiEzaugarriaAldatu(indizea) {
            balioak = [...jatorrizkoBalioak];
            if (indizea !== "") {
                const ind = parseInt(indizea);
                balioak[ind] = 11;
                hautatutakoGizakiEzaugarria = ind;
            } else {
                hautatutakoGizakiEzaugarria = "";
            }
            pertsonaiaEguneratu();
        }

        function jatorriaAukeratu(jatorria) {
            hautatutakoJatorria = jatorria;
            unekoPasua = 4;
            interfazaMarraztu();
            pertsonaiaEguneratu();
        }

        function jatorriDohainaAukeratu(dohaina) {
            hautatutakoJatorriDohaina = dohaina;
            unekoPasua = 5;
            interfazaMarraztu();
            pertsonaiaEguneratu();
        }

        function atzeraEgin(pasua) {
            unekoPasua = pasua;
            if (pasua < 3) {
                hautatutakoLeinua = "";
                balioak = [...jatorrizkoBalioak];
            }
            if (pasua < 4) {
                hautatutakoJatorria = "";
            }
            if (pasua < 5) {
                hautatutakoJatorriDohaina = "";
            }
            interfazaMarraztu();
            pertsonaiaEguneratu();
        }

        function interfazaMarraztu() {
            const eremua = document.getElementById("pausoakEremua");
            let html = "";

            if (unekoPasua === 1) {
                html += `<p>Sakatu botoia 7 ezaugarriak sortzeko:</p>`;
                html += `<button onclick="sortuEzaugarriak()">Sortu Ezaugarriak</button>`;
            } else if (unekoPasua === 2) {
                html += `<p><strong>1. Ezaugarriak</strong> ✓ (Eginda)</p>`;
                html += `<p><strong>2. Aukeratu Leinua:</strong></p>`;
                html += `<button onclick="leinuaAukeratu('Gizakia')">Gizakia</button> `;
                html += `<button onclick="leinuaAukeratu('Elfoa')">Elfoa</button> `;
                html += `<button onclick="leinuaAukeratu('Ipotxa')">Ipotxa</button> `;
                html += `<button onclick="leinuaAukeratu('Ertaina')">Ertaina</button> `;
                html += `<button onclick="leinuaAukeratu('Jentila')">Jentila</button><br><br>`;
                html += `<button onclick="atzeraEgin(1)">[ ATZERA ]</button>`;
            } else if (unekoPasua === 3) {
                html += `<p><strong>1. Ezaugarriak</strong> ✓ | <strong>2. Leinua:</strong> ${hautatutakoLeinua} ✓</p>`;
                
                if (hautatutakoLeinua === "Gizakia") {
                    html += `<p>Aukeratu 11 baino txikiagoa den ezaugarri bat 11ra igotzeko:</p>`;
                    html += `<select onchange="gizakiEzaugarriaAldatu(this.value)">`;
                    html += `<option value="">-- Hautatzea --</option>`;
                    for (let i = 0; i < 7; i++) {
                        if (jatorrizkoBalioak[i] < 11) {
                            let selected = (hautatutakoGizakiEzaugarria === i) ? "selected" : "";
                            html += `<option value="${i}" ${selected}>${ezaugarriak[i]} (${jatorrizkoBalioak[i]})</option>`;
                        }
                    }
                    html += `</select><br><br>`;
                }

                html += `<p><strong>3. Aukeratu Jatorria:</strong></p>`;
                if (hautatutakoLeinua === "Ertaina") {
                    html += `<button onclick="jatorriaAukeratu('Diaspora Eleshita')">Diaspora Eleshita (Estatusa: Oparoa)</button><br>`;
                } else {
                    html += `<p>Ez dago jatorririk eskuragarri leinu honentzat oraingoz.</p>`;
                }
                html += `<br><button onclick="atzeraEgin(2)">[ ATZERA ]</button>`;
            } else if (unekoPasua === 4) {
                html += `<p><strong>1. Ezaugarriak</strong> ✓ | <strong>2. Leinua:</strong> ${hautatutakoLeinua} ✓ | <strong>3. Jatorria:</strong> ${hautatutakoJatorria} ✓</p>`;
                html += `<p><strong>4. Aukeratu Jatorrizko Dohaina:</strong></p>`;
                html += `<button onclick="jatorriDohainaAukeratu('Malkarrak zelaitzen')">Malkarrak zelaitzen</button> `;
                html += `<button onclick="jatorriDohainaAukeratu('Uda Hirietako Sendia')">Uda Hirietako Sendia</button><br><br>`;
                html += `<button onclick="atzeraEgin(3)">[ ATZERA ]</button>`;
            } else if (unekoPasua >= 5) {
                html += `<p><strong>Pertsonaia sorkuntza osatuta!</strong></p>`;
                html += `<button onclick="atzeraEgin(4)">[ ATZERA ]</button>`;
            }

            eremua.innerHTML = html;
        }

        function pertsonaiaEguneratu() {
            // Leinua eta Deskribapena
            document.getElementById("fichaLeinua").textContent = hautatutakoLeinua || "Hautatu gabe";
            document.getElementById("fichaLeinuaDesk.textContent = leinuDeskribapenak[hautatutakoLeinua] || "";

            // Jatorria eta Deskribapena
            document.getElementById("fichaJatorria").textContent = hautatutakoJatorria || "Hautatu gabe";
            document.getElementById("fichaJatorriaDesk").textContent = jatorriDeskribapenak[hautatutakoJatorria] || "";

            // Ezaugarriak taula
            let ezaugarriHtml = "";
            for (let i = 0; i < ezaugarriak.length; i++) {
                ezaugarriHtml += `<tr>
                    <td>${ezaugarriak[i]}</td>
                    <td>${jatorrizkoBalioak[i]}</td>
                    <td><strong>${balioak[i]}</strong></td>
                </tr>`;
            }
            document.getElementById("fichaEzaugarriakTxa").innerHTML = ezaugarriHtml;

            // Oinarrizko Gaitasunak (Ezaugarria x 2)
            let gaitasunHtml = `
                <tr><td>ARRETA (HAU)</td><td>${balioak[3] * 2}</td></tr>
                <tr><td>ARTISAUTZA (TRE)</td><td>${balioak[1] * 2}</td></tr>
                <tr><td>ATLETISMOA (BIZ)</td><td>${balioak[2] * 2}</td></tr>
                <tr><td>BI ESKUKO ARMAK (TRE)</td><td>${balioak[1] * 2}</td></tr>
                <tr><td>BIZIRAUPENA (HAU)</td><td>${balioak[3] * 2}</td></tr>
                <tr><td>BORONDATEA (BOT)</td><td>${balioak[4] * 2}</td></tr>
                <tr><td>DISTANTZIAKO ARMAK (HAU)</td><td>${balioak[3] * 2}</td></tr>
                <tr><td>ERAGINA (KAR)</td><td>${balioak[6] * 2}</td></tr>
                <tr><td>ERRESISTENTZIA (SEN)</td><td>${balioak[0] * 2}</td></tr>
                <tr><td>ESKU BATEKO ARMAK (TRE)</td><td>${balioak[1] * 2}</td></tr>
                <tr><td>ESKU JOKOA (BIZ)</td><td>${balioak[2] * 2}</td></tr>
                <tr><td>IRUZUR EGIN (KAR)</td><td>${balioak[6] * 2}</td></tr>
                <tr><td>ISILTASUNA (BIZ)</td><td>${balioak[2] * 2}</td></tr>
                <tr><td>JAURTIGAIAK (TRE)</td><td>${balioak[1] * 2}</td></tr>
                <tr><td>KALE EZAGUTZA (KAR)</td><td>${balioak[6] * 2}</td></tr>
                <tr><td>MERKATARITZA (KAR)</td><td>${balioak[6] * 2}</td></tr>
                <tr><td>SAIHESTU (BIZ)</td><td>${balioak[2] * 2}</td></tr>
                <tr><td>ZALDIAK (TRE)</td><td>${balioak[1] * 2}</td></tr>
                <tr><td>ZORROZTASUNA (ADI)</td><td>${balioak[5] * 2}</td></tr>
            `;

            // Diaspora Eleshita jatorriak emandako gaitasun profesionalak (hasierako mailak)
            if (hautatutakoJatorria === "Diaspora Eleshita") {
                gaitasunHtml += `
                    <tr><td>Ohiturak (Eleshita)</td><td>4 Maila</td></tr>
                    <tr><td>Ohiturak (Erresuma Ertainak)</td><td>2 Maila</td></tr>
                    <tr><td>Merkataritza</td><td>2 Maila</td></tr>
                    <tr><td>Artisautza</td><td>1 Maila</td></tr>
                    <tr><td>Iruzur egin</td><td>1 Maila</td></tr>
                    <tr><td>Zorroztasuna</td><td>1 Maila</td></tr>
                    <tr><td>Jakituria (Legeak)</td><td>1 Maila</td></tr>
                `;
            }

            document.getElementById("fichaGaitasunakTxa").innerHTML = gaitasunHtml;

            // Dohainak
            let dohainenHtml = "";
            if (hautatutakoLeinua === "Ipotxa") {
                dohainenHtml += `<p><strong>Nekaezina (Ipotxa Dohaina):</strong> Kostua: UP 1. Egunean behin 10 Gogo puntu berreskuratzen dituzu.</p>`;
            } else if (hautatutakoLeinua === "Ertaina") {
                dohainenHtml += `<p><strong>Zori Ebasleak (Ertaina Dohaina):</strong> Kostua: UP 1. Saio bakoitzean behin. Adiskide baten ZP 1 lapurtzen duzu. Momentuan erabili beharko duzu.</p>`;
            }

            if (hautatutakoJatorriDohaina === "Malkarrak zelaitzen") {
                dohainenHtml += `<p><strong>Malkarrak zelaitzen (Jatorri Dohaina):</strong> Kostua: Istorioan behin. Zuk aukeratutako eta etsaia ez den PEJ oparo edo boteretsu baten jarrera +30 aldatzen da.</p>`;
            } else if (hautatutakoJatorriDohaina === "Uda Hirietako Sendia") {
                dohainenHtml += `<p><strong>Uda Hirietako Sendia (Jatorri Dohaina):</strong> Kostua: Istorioan behin. Istorioan behin Uda Hirietako merkatal famili handiekin lotura duen PEJ bat probarik egin gabe sortu ahalko duzu.</p>`;
            }

            if (dohainenHtml === "") {
                dohainenHtml = `<p>Oraingoz ez dago dohainik hautatuta.</p>`;
            }
            document.getElementById("fichaDohainak").innerHTML = dohainenHtml;
        }

        // Hasi interfazea
        interfazaMarraztu();
        pertsonaiaEguneratu();
    </script>
</body>
</html>
