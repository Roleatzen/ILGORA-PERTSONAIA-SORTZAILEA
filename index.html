<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ILGORA - Pertsonaia Sortzailea</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        /* -------------------------
           GOIBURUA
        ------------------------- */

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 4px;
        }

        header h2 {
            margin: 5px 0 0 0;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 2px;
        }


        /* -------------------------
           SORTZAILEA
        ------------------------- */

        #sortzailea {
            max-width: 900px;
            margin: 0 auto 50px auto;
            text-align: center;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 25px;
        }


        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background-color: #222;
            color: white;
        }


        /* -------------------------
           PERTSONAIA ORRIA
        ------------------------- */

        #pertsonaiaOrria {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border: 2px solid #222;
            padding: 30px;
            box-sizing: border-box;
        }

        #pertsonaiaOrria h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 2px;
        }


        /* Leinua eta ezaugarriak */

        .ficha-goiburua {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .kutxa {
            border: 1px solid #333;
            padding: 15px;
            min-height: 50px;
        }

        .kutxa-izenburua {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .kutxa-balioa {
            font-size: 20px;
        }


        /* Ezaugarriak */

        #fichaEzaugarriak {
            width: 100%;
        }

        #fichaEzaugarriak th {
            background-color: #444;
        }


        /* Pantaila txikietan */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            header h1 {
                font-size: 32px;
            }

            header h2 {
                font-size: 16px;
            }

            #pertsonaiaOrria {
                padding: 15px;
            }

            .ficha-goiburua {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         GOIBURUA
    ========================== -->

    <header>

        <h1>ILGORA</h1>

        <h2>PERTSONAIA SORTZAILEA</h2>

    </header>



    <!-- =========================
         SORTZAILEA
    ========================== -->

    <section id="sortzailea">

        <h2>Ezaugarriak (3d6)</h2>

        <button id="sortu">
            Sortu
        </button>


        <table>

            <thead>

                <tr>
                    <th>Ezaugarria</th>
                    <th>1. Dadoa</th>
                    <th>2. Dadoa</th>
                    <th>3. Dadoa</th>
                    <th>Denera</th>
                </tr>

            </thead>


            <tbody id="Emaitzataula">

            </tbody>

        </table>

    </section>



    <!-- =========================
         PERTSONAIA ORRIA
    ========================== -->

    <section id="pertsonaiaOrria">

        <h2>ILGORA - PERTSONAIA</h2>


        <!-- Leinua -->

        <div class="ficha-goiburua">

            <div class="kutxa">

                <div class="kutxa-izenburua">
                    LEINUA
                </div>

                <div
                    class="kutxa-balioa"
                    id="fichaLeinua">
                    —
                </div>

            </div>

        </div>



        <!-- Ezaugarriak -->

        <table id="fichaEzaugarriak">

            <thead>

                <tr>
                    <th>Ezaugarria</th>
                    <th>Balioa</th>
                </tr>

            </thead>


            <tbody id="fichaEzaugarriakGorputza">

            </tbody>

        </table>


    </section>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const ezaugarriak = [

            "Sendotasuna",
            "Trebezia",
            "Bizkortasuna",
            "Hautematea",
            "Boterea",
            "Adimena",
            "Karisma"

        ];


        /*
         * Dado bat jaurti
         */

        function dadoaJaurti() {

            return Math.floor(Math.random() * 6) + 1;

        }



        /*
         * Ezaugarriak sortu
         */

        function tiradakSortu() {

            const taula =
                document.getElementById("Emaitzataula");

            const fichaTaula =
                document.getElementById(
                    "fichaEzaugarriakGorputza"
                );


            // Aurreko emaitzak ezabatu

            taula.innerHTML = "";

            fichaTaula.innerHTML = "";



            /*
             * 7 ezaugarriak
             */

            for (
                let i = 0;
                i < ezaugarriak.length;
                i++
            ) {

                const dado1 = dadoaJaurti();
                const dado2 = dadoaJaurti();
                const dado3 = dadoaJaurti();

                const guztira =
                    dado1 + dado2 + dado3;



                /*
                 * Sortzaileko taula
                 */

                taula.innerHTML += `

                    <tr>

                        <td>
                            ${ezaugarriak[i]}
                        </td>

                        <td>
                            ${dado1}
                        </td>

                        <td>
                            ${dado2}
                        </td>

                        <td>
                            ${dado3}
                        </td>

                        <td>
                            <strong>
                                ${guztira}
                            </strong>
                        </td>

                    </tr>

                `;



                /*
                 * Pertsonaia-orriko taula
                 */

                fichaTaula.innerHTML += `

                    <tr>

                        <td>
                            ${ezaugarriak[i]}
                        </td>

                        <td>
                            <strong>
                                ${guztira}
                            </strong>
                        </td>

                    </tr>

                `;

            }

        }



        /*
         * Sortu botoia
         */

        document
            .getElementById("sortu")
            .addEventListener(
                "click",
                tiradakSortu
            );

    </script>


</body>

</html>
